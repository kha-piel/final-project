<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực - AI System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>

<body>
    <div id="particles-js"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useRef, useState } = React;

        const STATUS_EMPTY = { message: '', success: true };
        const DEFAULT_LOGIN_FORM = { identity: '', password: '' };
        const DEFAULT_REGISTER_FORM = { fullName: '', email: '', password: '', confirmPassword: '' };
        const PASSWORD_REGEX = /^(?=.*[A-Z])(?=.*[!@#\$%\^&\*\(\)_\+\-=\[\]\{\};':"\\|,.<>\/?]).{8,}$/;

        function AuthApp() {
            const [mode, setMode] = useState('login');
            const [title, setTitle] = useState('');
            const [loginForm, setLoginForm] = useState(DEFAULT_LOGIN_FORM);
            const [registerForm, setRegisterForm] = useState(DEFAULT_REGISTER_FORM);
            const [loginStatus, setLoginStatus] = useState(STATUS_EMPTY);
            const [registerStatus, setRegisterStatus] = useState(STATUS_EMPTY);
            const registerSuccessTimeoutRef = useRef(null);

            useEffect(() => {
                particlesJS('particles-js', {
                    particles: {
                        number: { value: 60, density: { enable: true, value_area: 800 } },
                        color: { value: '#ffffff' },
                        shape: { type: 'circle' },
                        opacity: { value: 0.3 },
                        size: { value: 3, random: true },
                        line_linked: { enable: true, distance: 150, color: '#ffffff', opacity: 0.2, width: 1 },
                        move: { enable: true, speed: 2 }
                    },
                    interactivity: {
                        detect_on: 'canvas',
                        events: { onhover: { enable: true, mode: 'grab' }, onclick: { enable: true, mode: 'push' } },
                        modes: { grab: { distance: 140, line_linked: { opacity: 0.5 } } }
                    },
                    retina_detect: true
                });

                const fullText = 'HỆ THỐNG AI-QUIZ';
                let index = 0;
                const typingTimer = window.setInterval(() => {
                    index += 1;
                    setTitle(fullText.slice(0, index));
                    if (index >= fullText.length) {
                        window.clearInterval(typingTimer);
                    }
                }, 40);

                gsap.set('#authCard', { autoAlpha: 1 });
                gsap.from('#authCard', { y: 40, opacity: 0, duration: 0.8, ease: 'back.out(1.2)' });
                gsap.fromTo(
                    '.fade-up-element',
                    { y: 20, opacity: 0 },
                    { y: 0, opacity: 1, duration: 0.5, stagger: 0.05, ease: 'power2.out', delay: 0.15 }
                );

                const buttons = Array.from(document.querySelectorAll('.pill-btn'));
                const resizeHandlers = [];

                buttons.forEach((btn) => {
                    const circle = btn.querySelector('.hover-circle');
                    const label = btn.querySelector('.pill-label');
                    const labelHover = btn.querySelector('.pill-label-hover');
                    let activeTween;
                    let buttonTimeline;

                    const calculateMath = () => {
                        const rect = btn.getBoundingClientRect();
                        const width = rect.width || 320;
                        const height = rect.height || 44;
                        const radius = ((width * width) / 4 + height * height) / (2 * height);
                        const diameter = Math.ceil(2 * radius) + 2;
                        const delta = Math.ceil(radius - Math.sqrt(Math.max(0, radius * radius - (width * width) / 4))) + 1;
                        const originY = diameter - delta;

                        circle.style.width = `${diameter}px`;
                        circle.style.height = `${diameter}px`;
                        circle.style.bottom = `-${delta}px`;

                        gsap.set(circle, { xPercent: -50, scale: 0, transformOrigin: `50% ${originY}px` });
                        gsap.set(label, { y: 0 });
                        gsap.set(labelHover, { y: height + 12, opacity: 0 });

                        buttonTimeline = gsap.timeline({ paused: true });
                        buttonTimeline.to(circle, { scale: 1.2, xPercent: -50, duration: 0.6, ease: 'power3.out', overwrite: 'auto' }, 0);
                        buttonTimeline.to(label, { y: -(height + 8), duration: 0.6, ease: 'power3.out', overwrite: 'auto' }, 0);
                        buttonTimeline.to(labelHover, { y: 0, opacity: 1, duration: 0.6, ease: 'power3.out', overwrite: 'auto' }, 0);
                    };

                    calculateMath();
                    const onResize = () => calculateMath();
                    resizeHandlers.push(onResize);
                    window.addEventListener('resize', onResize);

                    btn.addEventListener('mouseenter', () => {
                        if (activeTween) {
                            activeTween.kill();
                        }
                        activeTween = buttonTimeline.tweenTo(buttonTimeline.duration(), {
                            duration: 0.4,
                            ease: 'power3.out',
                            overwrite: 'auto'
                        });
                    });

                    btn.addEventListener('mouseleave', () => {
                        if (activeTween) {
                            activeTween.kill();
                        }
                        activeTween = buttonTimeline.tweenTo(0, {
                            duration: 0.3,
                            ease: 'power3.out',
                            overwrite: 'auto'
                        });
                    });
                });

                return () => {
                    window.clearInterval(typingTimer);
                    resizeHandlers.forEach((handler) => window.removeEventListener('resize', handler));
                    if (registerSuccessTimeoutRef.current) {
                        window.clearTimeout(registerSuccessTimeoutRef.current);
                    }
                };
            }, []);

            useEffect(() => {
                window.showLoginStatus = (message, success) => {
                    setLoginStatus({ message: message || '', success: success !== false });
                };
                window.showRegisterStatus = (message, success) => {
                    setRegisterStatus({ message: message || '', success: success !== false });
                };
                window.prefillLoginIdentity = (value) => {
                    setLoginForm((current) => ({ ...current, identity: value || '', password: '' }));
                };
                window.clearAuthForms = () => {
                    setLoginForm(DEFAULT_LOGIN_FORM);
                    setRegisterForm(DEFAULT_REGISTER_FORM);
                };
                window.showLoginForm = () => {
                    setMode('login');
                };
                window.handleRegisterSuccess = (message, loginIdentity) => {
                    const safeMessage = message || 'Đăng ký thành công.';
                    setRegisterStatus({ message: safeMessage, success: true });
                    setLoginForm((current) => ({ ...current, identity: loginIdentity || '', password: '' }));
                    setRegisterForm(DEFAULT_REGISTER_FORM);

                    if (registerSuccessTimeoutRef.current) {
                        window.clearTimeout(registerSuccessTimeoutRef.current);
                    }

                    registerSuccessTimeoutRef.current = window.setTimeout(() => {
                        setMode('login');
                        setLoginStatus({
                            message: `${safeMessage} Vui lòng đăng nhập bằng tài khoản vừa tạo.`,
                            success: true
                        });
                        setRegisterStatus(STATUS_EMPTY);
                    }, 900);
                };

                return () => {
                    delete window.showLoginStatus;
                    delete window.showRegisterStatus;
                    delete window.prefillLoginIdentity;
                    delete window.clearAuthForms;
                    delete window.showLoginForm;
                    delete window.handleRegisterSuccess;
                };
            }, []);

            const setStatusClass = (status) => {
                const classes = ['status-text', 'fade-up-element'];
                if (status.message) {
                    classes.push(status.success ? 'success' : 'error', 'visible');
                }
                return classes.join(' ');
            };

            const iconColor = (value, isValid) => {
                if (!value) {
                    return 'var(--text-gray)';
                }
                return isValid ? '#4CAF50' : '#f44336';
            };

            const isNameValid = registerForm.fullName.trim().length >= 2;
            const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(registerForm.email);
            const isPasswordValid = PASSWORD_REGEX.test(registerForm.password);
            const isConfirmValid = registerForm.confirmPassword !== '' && registerForm.confirmPassword === registerForm.password;

            const handleLoginSubmit = (event) => {
                event.preventDefault();
                if (window.javaBridge && typeof window.javaBridge.login === 'function') {
                    window.javaBridge.login(loginForm.identity, loginForm.password);
                }
            };

            const handleRegisterSubmit = (event) => {
                event.preventDefault();
                if (window.javaBridge && typeof window.javaBridge.register === 'function') {
                    window.javaBridge.register(
                        registerForm.fullName,
                        registerForm.email,
                        registerForm.password,
                        registerForm.confirmPassword
                    );
                }
            };

            return (
                <div className={`auth-container ${mode === 'register' ? 'to-register' : 'to-login'}`} id="authCard">
                    <div className="form-container sign-in-container">
                        <form onSubmit={handleLoginSubmit}>
                            <i className="fa-solid fa-brain logo-icon fade-up-element"></i>
                            <h2 className="title fade-up-element" id="typewriterText">{title}</h2>

                            <div className="form-group w-100 fade-up-element">
                                <label className="form-label">Tên đăng nhập hoặc Email</label>
                                <div className="input-wrapper">
                                    <i className="fa-solid fa-user input-icon"></i>
                                    <input
                                        type="text"
                                        className="form-input"
                                        placeholder="Nhập tài khoản..."
                                        value={loginForm.identity}
                                        onChange={(event) => setLoginForm((current) => ({ ...current, identity: event.target.value }))}
                                    />
                                </div>
                            </div>

                            <div className="form-group w-100 fade-up-element">
                                <label className="form-label">Mật khẩu</label>
                                <div className="input-wrapper">
                                    <i className="fa-solid fa-lock input-icon"></i>
                                    <input
                                        type="password"
                                        className="form-input"
                                        placeholder="Nhập mật khẩu..."
                                        value={loginForm.password}
                                        onChange={(event) => setLoginForm((current) => ({ ...current, password: event.target.value }))}
                                    />
                                </div>
                            </div>

                            <a href="#" className="forgot-pass fade-up-element" style={{ alignSelf: 'flex-start' }}>Quên mật khẩu?</a>

                            <div className="w-100 fade-up-element">
                                <button type="submit" className="login-btn pill-btn" id="loginBtn">
                                    <span className="hover-circle"></span>
                                    <span className="label-stack">
                                        <span className="pill-label">ĐĂNG NHẬP</span>
                                        <span className="pill-label-hover">ĐĂNG NHẬP</span>
                                    </span>
                                </button>
                            </div>

                            <div id="loginStatus" className={setStatusClass(loginStatus)}>{loginStatus.message}</div>
                        </form>
                    </div>

                    <div className="form-container sign-up-container">
                        <form onSubmit={handleRegisterSubmit}>
                            <i className="fa-solid fa-user-plus logo-icon fade-up-element"></i>
                            <h2 className="title fade-up-element">ĐĂNG KÍ TÀI KHOẢN</h2>

                            <div className="form-group w-100 fade-up-element">
                                <label className="form-label">Họ và Tên</label>
                                <div className="input-wrapper">
                                    <i className="fa-solid fa-address-card input-icon" style={{ color: iconColor(registerForm.fullName, isNameValid) }}></i>
                                    <input
                                        type="text"
                                        className="form-input"
                                        placeholder="Nhập họ tên..."
                                        value={registerForm.fullName}
                                        onChange={(event) => setRegisterForm((current) => ({ ...current, fullName: event.target.value }))}
                                    />
                                </div>
                            </div>

                            <div className="form-group w-100 fade-up-element">
                                <label className="form-label">Email</label>
                                <div className="input-wrapper">
                                    <i className="fa-solid fa-envelope input-icon" style={{ color: iconColor(registerForm.email, isEmailValid) }}></i>
                                    <input
                                        type="email"
                                        className="form-input"
                                        placeholder="...@gmail.com"
                                        value={registerForm.email}
                                        onChange={(event) => setRegisterForm((current) => ({ ...current, email: event.target.value }))}
                                    />
                                </div>
                            </div>

                            <div className="form-group w-100 fade-up-element">
                                <label className="form-label">Mật khẩu</label>
                                <div className="input-wrapper">
                                    <i className="fa-solid fa-lock input-icon" style={{ color: iconColor(registerForm.password, isPasswordValid) }}></i>
                                    <input
                                        type="password"
                                        className="form-input"
                                        placeholder="Tối thiểu 8 ký tự, 1 kí tự hoa, đặc biệt..."
                                        value={registerForm.password}
                                        onChange={(event) => setRegisterForm((current) => ({ ...current, password: event.target.value }))}
                                    />
                                </div>
                            </div>

                            <div className="form-group w-100 fade-up-element">
                                <label className="form-label">Xác nhận mật khẩu</label>
                                <div className="input-wrapper">
                                    <i className="fa-solid fa-check-double input-icon" style={{ color: iconColor(registerForm.confirmPassword, isConfirmValid) }}></i>
                                    <input
                                        type="password"
                                        className="form-input"
                                        placeholder="Nhập lại mật khẩu..."
                                        value={registerForm.confirmPassword}
                                        onChange={(event) => setRegisterForm((current) => ({ ...current, confirmPassword: event.target.value }))}
                                    />
                                </div>
                            </div>

                            <div className="w-100 fade-up-element">
                                <button type="submit" className="login-btn pill-btn" id="registerBtn">
                                    <span className="hover-circle"></span>
                                    <span className="label-stack">
                                        <span className="pill-label">ĐĂNG KÝ NGAY</span>
                                        <span className="pill-label-hover">ĐĂNG KÝ NGAY</span>
                                    </span>
                                </button>
                            </div>

                            <div id="registerStatus" className={setStatusClass(registerStatus)}>{registerStatus.message}</div>
                        </form>
                    </div>

                    <div className="overlay-layer">
                        <div className="overlay-panel overlay-left">
                            <h2 className="wipe-element" style={{ '--i': 0 }}>Đã có tài khoản?</h2>
                            <p className="wipe-element" style={{ '--i': 1 }}></p>
                            <button
                                className="ghost-btn wipe-element"
                                id="signInToggle"
                                style={{ '--i': 2 }}
                                type="button"
                                onClick={() => setMode('login')}
                            >
                                ĐĂNG NHẬP
                            </button>
                        </div>

                        <div className="overlay-panel overlay-right">
                            <h2 className="wipe-element" style={{ '--i': 0 }}>Chưa có tài khoản?</h2>
                            <p className="wipe-element" style={{ '--i': 1 }}></p>
                            <button
                                className="ghost-btn wipe-element"
                                id="signUpToggle"
                                style={{ '--i': 2 }}
                                type="button"
                                onClick={() => setMode('register')}
                            >
                                ĐĂNG KÝ NGAY
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<AuthApp />);
    </script>
</body>

</html>
